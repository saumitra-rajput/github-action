    real-test:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v4
            - name: Install python
              uses: actions/setup-python@v5
              with:
                python-version: "3.10"
            - name: Install dependencies
              run: pip install -r requirements.txt
            - name: Run the code check(run app.py)
              run: |
                flake8 app.py
            - name: Final output
              run: |
                echo "All good, everything worked!"
                
            
            