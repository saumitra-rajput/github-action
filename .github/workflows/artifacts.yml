name: Secret-Artifacts

on: 
    push:
        branches: [ main ]

jobs:
    # secrets:
    #     runs-on: ubuntu-latest
    #     steps:
    #         - name: Try to print test secret
    #           run: echo " This is ${{ secrets.MY_TEST_SECRET }}"

    docker-login:
        runs-on: ubuntu-latest
        steps: 
            - name: Docker login.
              uses: docker/login-action@v3
              with:
                username: ${{ vars.DOCKERHUB_USER }}
                password: ${{ secrets.DOCKERHUB_SECRET }}

            - name: DOCKER images 
              run: docker ps -a

            - name: Test report file
              run: |
                mkdir report
                echo "Test 1 - $(date)" > report/test.txt
                echo "Second line all good" >> report/test.txt

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                name: test-report
                path: report/test.txt

            
            