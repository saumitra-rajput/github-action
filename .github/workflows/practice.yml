# Task 4 matrix builds
name: matrix-python

on:
    workflow_dispatch:
    push:
        branches: [main]

jobs:
    install-py:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: ["ubuntu-latest", "windows-latest"]
                python-version: ["3.10", "3.999", "3.12"]
        steps:
            - name: Install Python  ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                python-version: ${{ matrix.python-version }}
            - name: Print the python-version installed.
              run: python3 --version

