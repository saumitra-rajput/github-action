# This file will copy the code in runner 
# Install the python and it's dependencies
# Make sure if your requirements.txt has flake8 included.
# Run the code check for app.py in using Linter flake8 

# Updated the Lint : only run on manually

name: linter for Python

on: 
    workflow_dispatch:

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v4
            - name: setup python
              uses: actions/setup-python@v5
              with:
                python-version: "3.13"
            - name: install dependencies
              run: pip install -r requirements.txt
            - name: run linter
              run: flake8 app.py