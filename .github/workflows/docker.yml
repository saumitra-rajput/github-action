# This file will copy the code in runner.
# Run the dockerfile (context .)
# Login into the DockerHub using env variables and secrets
# Push the build image to the Docker hub with the tag define below

name: docker

on: 
    push: 
        branches: [ main ]

jobs:
    docker-build:
        runs-on: ubuntu-latest
        steps:
            - name: code checkout
              uses: actions/checkout@v4
            
            - name: GitHub login
              uses: docker/login-action@v3
              with:
                username: ${{ vars.DOCKERHUB_USER }}
                password: ${{ secrets.DOCKERHUB_SECRET }}
            
            - name: build and push to Docker Hub
              uses: docker/build-push-action@v6
              with:
                context: .
                push: true
                tags: |
                  ${{ vars.DOCKERHUB_USER }}/${{ vars.GITHUB_REPO }}:${{ github.github.ref_name}}
                  ${{ vars.DOCKERHUB_USER }}/action:${{ github.sha }}
                  ${{ vars.DOCKERHUB_USER }}/action:v1.0






