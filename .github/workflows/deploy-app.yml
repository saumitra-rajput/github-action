name: Deploy app on self-hosted runner

on: 
    push:
        branches: [ main ]

jobs:    
    deploy:
        # env:
        #     GITHUB_USER: ${{ vars.GITHUB_USER }}

        runs-on: self-hosted
        steps:
            - name: checkout code
              uses: actions/checkout@v4
# You have to make sure your Runner has docker.io and docker-compose installed with the correct permissions            
                # sudo apt update
                # sudo apt install -y docker.io docker-compose-plugin
                # sudo systemctl enable docker
                # sudo systemctl start docker
                # sudo usermod -aG docker $USER   
            
            - name: login into the Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ vars.DOCKERHUB_USER }}
                password: ${{ secrets.DOCKERHUB_SECRET }}
            
            # - name: deploy with docker compose
            #   run: docker compose up -d --build